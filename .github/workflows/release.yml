# 全平台打包 + 发版：打 tag 触发，在 macos / windows 原生 runner 上各打一份，
# 自动上传到对应 Release。详见仓库根目录 RELEASING.md。
#
# 触发方式：
#   1) 推送 tag：git tag vX.Y.Z && git push origin vX.Y.Z  →  从该 tag 构建并发布
#   2) 手动补建/重跑：Actions → Run workflow，填 tag（必填，如 v0.1.2），
#      可选 ref（构建用的 commit，默认即 tag；补建旧版时可填 main）
#
# 产物命名（见 package.json build.artifactName）：
#   macOS arm64 → Bambu.Buddy-<ver>-macOS-arm64.dmg / .zip（Developer ID 签名 + 公证）
#   Windows x64 → Bambu.Buddy-<ver>-Windows-x64.Setup.exe（未签名）
# 另有应用内自动更新所需的 latest-mac.yml / latest.yml / *.blockmap（见 RELEASING.md「产物」）。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的 Release tag（如 v0.1.2，必填）'
        required: true
      ref:
        description: '构建用的 commit/ref（默认即 tag；补建旧版可填 main）'
        required: false
      draft:
        description: '建成草稿 Release（测试包用：不公开、不影响老用户自动更新，验完在页面点 Publish 即转正）'
        type: boolean
        default: false

# tag 名（Release 标识）；构建用的 ref（默认与 tag 相同）；是否草稿（仅手动触发可选，推 tag 恒为正式发布）
env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.tag) || github.ref_name }}
  DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 准备公证用 API Key（把 secret 里的 .p8 写到临时文件）
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/authkey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/authkey.p8" >> "$GITHUB_ENV"
      - run: npm run build:mac
        env:
          # Developer ID 正式签名：.p12（证书+私钥）base64 存在 CSC_LINK，密码存在 CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证：App Store Connect API Key（APPLE_API_KEY 指向上一步写出的 .p8 文件）
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          # zip + latest-mac.yml + blockmap 是应用内自动更新（electron-updater）的依赖：
          # 老版本应用读 latest-mac.yml 找到 zip 下载安装。缺了它们应用内更新即失效。
          # dmg.blockmap 排除：mac 更新只走 zip，dmg 的增量索引用不上（构建侧已
          # writeUpdateInfo:false 不再生成，这里兜底），少一个资产让 Release 页更清爽。
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
            !dist/*.dmg.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-dist
          # latest.yml + blockmap 是应用内自动更新（electron-updater）的依赖，同 mac 说明。
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要仓库代码：下面「镜像到腾讯云 COS」那步要跑 scripts/upload-cos.js。
      # 必须排在 download-artifact 之前——checkout 会清空工作区。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG_NAME }}
          REPO: ${{ github.repository }}
          DRAFT: ${{ env.DRAFT }}
          TARGET: ${{ env.BUILD_REF }}
        run: |
          set -e
          # 发版说明来自仓库根目录的英文 RELEASE_NOTES.md（发版前手写好），**不再** 用
          # --generate-notes 照抄 PR 标题——那会把中文 PR 标题带进说明（见 RELEASING.md）。
          NOTES_FILE="RELEASE_NOTES.md"
          # 硬闸①：必须有非空的发版说明，否则直接失败（绝不用 PR 标题兜底）。
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE 缺失或为空——发版前请先写好 $TAG 的英文发版说明（见 RELEASING.md）。"
            exit 1
          fi
          # 硬闸②：说明不得含中日韩字符（发版说明必须全英文）。emoji（如 🇨🇳）不受影响。
          if LC_ALL=C.UTF-8 grep -qP '[\x{3040}-\x{30ff}\x{3400}-\x{9fff}\x{f900}-\x{faff}\x{ff00}-\x{ffef}]' "$NOTES_FILE"; then
            echo "::error::$NOTES_FILE 含中日韩字符——发版说明必须全英文。"
            exit 1
          fi
          # 组装正文：英文说明 + 自动附「Full Changelog」比较链接。上一版取自当前「最新 Release」
          # （本次尚未创建，故 /releases/latest 即上一版），不依赖 git tag 抓取、也不看 PR 标题。
          BODY_FILE="$RUNNER_TEMP/release-body.md"
          cp "$NOTES_FILE" "$BODY_FILE"
          PREV=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG" >> "$BODY_FILE"
          fi
          # Release 不存在则创建（用手写英文说明；已存在则跳过，保留正文）。
          # 草稿模式（DRAFT=true，仅手动触发）：加 --draft 建成草稿——不公开、不进 releases API，
          # 故不会被老版本应用的自动更新当成「最新版」拉走。用 --target 让草稿关联到本次构建的
          # 那个 commit，将来在页面点 Publish 转正时 tag 就落在实测过的代码上。
          CREATE_ARGS=(--repo "$REPO" --title "Bambu Buddy $TAG" --notes-file "$BODY_FILE")
          if [ "$DRAFT" = "true" ]; then
            CREATE_ARGS+=(--draft --target "$TARGET")
          fi
          gh release create "$TAG" "${CREATE_ARGS[@]}" || true
          # 上传/覆盖 mac + win 安装包，以及应用内自动更新所需的 zip / latest*.yml / blockmap
          # （dmg.blockmap 除外：mac 更新只走 zip，用不上）
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \
            -o -name '*.yml' -o -name '*.blockmap' \) ! -name '*.dmg.blockmap' -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
          echo "=== $TAG 资产 ==="
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
      - name: 在说明顶部注入「下载」引导（幂等）
        # 资产列表混着 yml/zip/blockmap（自动更新依赖），普通用户分不清该下哪个。
        # 在说明最前面固定给 dmg/exe 两个安装包的直链。幂等：说明里已有该节就跳过，
        # 故补建/重跑不会重复注入，也不覆盖手写说明里已存在的引导。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG_NAME }}
          REPO: ${{ github.repository }}
          DRAFT: ${{ env.DRAFT }}
          # 拼中国大陆镜像链接用；未配 COS 时为空 → 不注入镜像行（不出现死链）。
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          set -e
          VER="${TAG#v}"                                   # 文件名用不带 v 的版本号
          BASE="https://github.com/$REPO/releases/download/$TAG"
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')
          if printf '%s' "$BODY" | grep -qF '## 📥 Download'; then
            echo "Download guide already present, skipping"; exit 0
          fi
          # 中国大陆镜像用 COS 的「版本化」路径（bambu-buddy/<tag>/…）：它只属于本版、
          # 永久归档，故放进本版说明里永远正确——即使将来出了新版、用户翻回旧版页面点它，
          # 下到的仍是本版（对外 README 用的是 download/ 固定链，那条永远指向最新版，
          # 不能放进按版本归档的说明里）。仅在「非草稿 且 配了 COS」时拼，否则留空：
          # 草稿不镜像、未配 COS 也没文件，避免注入指向不存在文件的死链。
          COS_BASE=""
          if [ "$DRAFT" != "true" ] && [ -n "$COS_BUCKET" ] && [ -n "$COS_REGION" ]; then
            COS_BASE="https://$COS_BUCKET.cos.$COS_REGION.myqcloud.com/bambu-buddy/$TAG"
          fi
          {
            printf '## 📥 Download\n\n'
            printf -- '- **macOS (Apple Silicon)**: [Bambu.Buddy-%s-macOS-arm64.dmg](%s/Bambu.Buddy-%s-macOS-arm64.dmg)\n' "$VER" "$BASE" "$VER"
            printf -- '- **Windows (x64)**: [Bambu.Buddy-%s-Windows-x64.Setup.exe](%s/Bambu.Buddy-%s-Windows-x64.Setup.exe)\n\n' "$VER" "$BASE" "$VER"
            if [ -n "$COS_BASE" ]; then
              printf '> 🇨🇳 **China mainland mirror** (use if GitHub download is slow or blocked): [macOS](%s/Bambu.Buddy-%s-macOS-arm64.dmg) · [Windows](%s/Bambu.Buddy-%s-Windows-x64.Setup.exe)\n\n' "$COS_BASE" "$VER" "$COS_BASE" "$VER"
            fi
            printf '> The other files in the asset list (`latest*.yml` / `*.zip` / `*.blockmap`) are needed for in-app auto-update; regular users can ignore them.\n\n'
            printf -- '---\n\n'
            printf '%s' "$BODY"
          } | gh release edit "$TAG" --repo "$REPO" --notes-file -
          echo "Download guide injected"
      - name: 硬闸——最终 Release 正文必须全英文（含中日韩字符即失败）
        # 兜底闸：不管正文从哪来（手写说明 + 注入的下载引导），发布后再抓一次实际正文，
        # 只要含中日韩字符就让 job 变红。把「全英文」从「靠自觉」变成「机器强制」，
        # 从物理上杜绝中文发版说明流到用户手里。注入的下载引导为英文 + emoji，正常通过。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG_NAME }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')
          if printf '%s' "$BODY" | LC_ALL=C.UTF-8 grep -qP '[\x{3040}-\x{30ff}\x{3400}-\x{9fff}\x{f900}-\x{faff}\x{ff00}-\x{ffef}]'; then
            echo "::error::$TAG 的 Release 正文含中日韩字符——发版说明必须全英文。请改成英文后重跑本工作流。"
            exit 1
          fi
          echo "Release notes English-only check passed."
      - name: 镜像到腾讯云 COS（中国大陆下载）
        # 大陆用户访问 GitHub 困难（下载不了安装包、应用内自动更新也连不上），
        # 故把安装包与自动更新 feed 同步一份到 COS。上传去向见 scripts/upload-cos.js。
        #
        # 草稿构建跳过：草稿是自测包，一旦覆盖 latest/ 会让线上用户自动更新到测试版，
        # 覆盖 download/ 会让公开直链指向测试版——两者都不能被没转正的包污染。
        #
        # 未配置 COS Secrets 时脚本自行跳过并正常退出，不会让发版流程变红
        # （方便先合这套改动、之后再补配 Secrets）。
        if: env.DRAFT != 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          TAG: ${{ env.TAG_NAME }}
          ARTIFACTS_DIR: artifacts
        run: |
          set -e
          # cos-nodejs-sdk-v5 装到临时目录、经 NODE_PATH 引入：不碰仓库的 node_modules，
          # 免得在这个只做上传的 job 里把 electron 等重依赖一并装上。
          npm i --prefix "$RUNNER_TEMP/cosdeps" cos-nodejs-sdk-v5@3.0.0 --no-audit --no-fund --loglevel=error
          NODE_PATH="$RUNNER_TEMP/cosdeps/node_modules" node scripts/upload-cos.js
